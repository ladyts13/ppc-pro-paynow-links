<script>
(function () {
  var root = document.documentElement;

  function unlock() {
    root.classList.remove('ppc-locked');
    addLogout();
  }

  function lock() {
    root.classList.add('ppc-locked');
    var existing = document.getElementById('ppc-logout-btn');
    if (existing) existing.parentNode.removeChild(existing);
  }

  function addLogout() {
    if (document.getElementById('ppc-logout-btn')) return;
    var btn = document.createElement('button');
    btn.id = 'ppc-logout-btn';
    btn.type = 'button';
    btn.textContent = 'Log out';
    btn.style.cssText = 'position:fixed;top:12px;right:16px;z-index:9999;background:#d4af37;color:#000;font-weight:700;font-size:12px;padding:6px 14px;border:none;border-radius:20px;cursor:pointer;letter-spacing:0.05em;text-transform:uppercase;';
    btn.onclick = function () { netlifyIdentity.logout(); };
    document.body.appendChild(btn);
  }

  function wireButton() {
    var loginBtn = document.getElementById('ppc-login-btn');
    if (loginBtn) {
      loginBtn.onclick = function () { netlifyIdentity.open('login'); };
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', wireButton);
  } else {
    wireButton();
  }

  if (!window.netlifyIdentity) { return; }
  netlifyIdentity.on('init', function (user) { user ? unlock() : lock(); });
  netlifyIdentity.on('login', function () { unlock(); netlifyIdentity.close(); });
  netlifyIdentity.on('logout', function () { lock(); });
}());
</script>

        const { useState, useEffect } = React;

        // --- LOCAL STORAGE HOOK (Keeps data from disappearing) ---
        function useLocalStorage(key, initialValue) {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    console.warn("Error reading localStorage", error);
                    return initialValue;
                }
            });
            useEffect(() => {
                try {
                    window.localStorage.setItem(key, JSON.stringify(storedValue));
                } catch (error) {
                    console.warn("Error setting localStorage", error);
                }
            }, [key, storedValue]);
            return [storedValue, setStoredValue];
        }

        function App() {
            const [activeTab, setActiveTab] = useLocalStorage('ppc_activeTab', 'start');

            // --- STATE (Persisted via LocalStorage) ---
            const [materialsDB, setMaterialsDB] = useLocalStorage('ppc_materialsDB', [
                { id: 1, name: 'Glossy Sticker Paper', packCost: 17.99, packQty: 100, unitCost: 0.18 },
                { id: 2, name: 'Gift Boxes (4x4)', packCost: 24.00, packQty: 30, unitCost: 0.80 }
            ]);
            const [savedProducts, setSavedProducts] = useLocalStorage('ppc_savedProducts', []);
            const [calcMaterials, setCalcMaterials] = useLocalStorage('ppc_calcMaterials', []);
            const [calcLabor, setCalcLabor] = useLocalStorage('ppc_calcLabor', []);
            
            // --- Customer & Item Description ---
            const [customerName, setCustomerName] = useLocalStorage('ppc_customerName', '');
            const [itemDescription, setItemDescription] = useLocalStorage('ppc_itemDescription', '');
            
            // --- OVERHEAD COSTS LOGIC ---
            const [monthlyOverhead, setMonthlyOverhead] = useLocalStorage('ppc_monthlyOverhead', '');
            const [monthlyOrders, setMonthlyOrders] = useLocalStorage('ppc_monthlyOrders', '30');
            const [perOrderCost, setPerOrderCost] = useLocalStorage('ppc_perOrderCost', '');
            
            // --- DISCOUNT LOGIC ---
            const [discountPercent, setDiscountPercent] = useLocalStorage('ppc_discountPercent', '0');
            
            // --- PROFIT SLIDER STATE ---
            const [profitMargin, setProfitMargin] = useLocalStorage('ppc_profitMargin', 50);

            // --- INVOICE STATE ---
            const [invoiceCustomer, setInvoiceCustomer] = useState('');
            const [invoiceOrderNum, setInvoiceOrderNum] = useState('');
            const [selectedInvoiceItems, setSelectedInvoiceItems] = useState([]);
            const [invoiceCounter, setInvoiceCounter] = useLocalStorage('ppc_invoiceCounter', 1001);

            // --- BUSINESS IDENTITY ---
            const [businessName, setBusinessName] = useLocalStorage('ppc_businessName', '');

            // --- PAYMENT METHODS ---
            const [cashAppLink, setCashAppLink] = useLocalStorage('ppc_cashAppLink', '');
            const [paypalLink, setPaypalLink] = useLocalStorage('ppc_paypalLink', '');
            const [venmoLink, setVenmoLink] = useLocalStorage('ppc_venmoLink', '');
            const [stripeLink, setStripeLink] = useLocalStorage('ppc_stripeLink', '');
            const [zelleQRData, setZelleQRData] = useLocalStorage('ppc_zelleQR', '');
            const [rememberCashApp, setRememberCashApp] = useLocalStorage('ppc_remCA', false);
            const [rememberPaypal, setRememberPaypal] = useLocalStorage('ppc_remPP', false);
            const [rememberVenmo, setRememberVenmo] = useLocalStorage('ppc_remVM', false);
            const [rememberStripe, setRememberStripe] = useLocalStorage('ppc_remST', false);
            const [rememberZelle, setRememberZelle] = useLocalStorage('ppc_remZE', false);
            const [includeCashApp, setIncludeCashApp] = useLocalStorage('ppc_inclCA', false);
            const [includePaypal, setIncludePaypal] = useLocalStorage('ppc_inclPP', false);
            const [includeVenmo, setIncludeVenmo] = useLocalStorage('ppc_inclVM', false);
            const [includeStripe, setIncludeStripe] = useLocalStorage('ppc_inclST', false);
            const [includeZelle, setIncludeZelle] = useLocalStorage('ppc_inclZE', false);

            // UI States for Mobile Feedback
            const [pdfStatus, setPdfStatus] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);

            // --- VOLATILE STATE (Clears on refresh, for inputs) ---
            const [newMaterial, setNewMaterial] = useState({ name: '', packCost: '', packQty: '' });
            const [selectedDbMaterial, setSelectedDbMaterial] = useState('');
            const [customMaterial, setCustomMaterial] = useState({ name: '', unitCost: '', qty: '1' });
            const [newLabor, setNewLabor] = useState({ task: 'Labor', minutes: '', rate: '20' });

            const formatCurrency = (amount) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount || 0);

            // --- PAYMENT HELPERS ---
            const clearNonRememberedPayments = () => {
                if (!rememberCashApp) setCashAppLink('');
                if (!rememberPaypal) setPaypalLink('');
                if (!rememberVenmo) setVenmoLink('');
                if (!rememberStripe) setStripeLink('');
                if (!rememberZelle) setZelleQRData('');
            };
            const clearAllPayments = () => {
                setCashAppLink(''); setPaypalLink(''); setVenmoLink(''); setStripeLink(''); setZelleQRData('');
                setRememberCashApp(false); setRememberPaypal(false); setRememberVenmo(false); setRememberStripe(false); setRememberZelle(false);
                setIncludeCashApp(false); setIncludePaypal(false); setIncludeVenmo(false); setIncludeStripe(false); setIncludeZelle(false);
            };
            const handleZelleQRUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onloadend = () => setZelleQRData(reader.result);
                reader.readAsDataURL(file);
            };

            // --- AUTO-FILL INVOICE NUMBER & CUSTOMER NAME ---
            useEffect(() => {
                if (activeTab === 'invoice') {
                    if (!invoiceOrderNum) {
                        setInvoiceOrderNum('INV-' + invoiceCounter);
                    }
                    if (!invoiceCustomer && savedProducts.length > 0) {
                        // Automatically pull the customer name from the most recently saved product!
                        setInvoiceCustomer(savedProducts[savedProducts.length - 1].customerName);
                    }
                }
            }, [activeTab, invoiceOrderNum, invoiceCounter, invoiceCustomer, savedProducts]);

            const handleAddToDB = (e) => {
                e.preventDefault();
                const cost = parseFloat(newMaterial.packCost);
                const qty = parseInt(newMaterial.packQty);
                if (!newMaterial.name || isNaN(cost) || isNaN(qty) || qty <= 0) return;
                const unitCost = cost / qty;
                setMaterialsDB([...materialsDB, { id: Date.now(), name: newMaterial.name, packCost: cost, packQty: qty, unitCost }]);
                setNewMaterial({ name: '', packCost: '', packQty: '' });
            };

            const handleAddMaterialToCalc = () => {
                if (selectedDbMaterial) {
                    const dbItem = materialsDB.find(m => m.id.toString() === selectedDbMaterial);
                    if (dbItem) {
                        setCalcMaterials([...calcMaterials, { id: Date.now(), name: dbItem.name, unitCost: dbItem.unitCost, qty: parseFloat(customMaterial.qty) || 1 }]);
                    }
                } else if (customMaterial.name && customMaterial.unitCost) {
                    setCalcMaterials([...calcMaterials, { id: Date.now(), name: customMaterial.name, unitCost: parseFloat(customMaterial.unitCost), qty: parseFloat(customMaterial.qty) || 1 }]);
                }
                setCustomMaterial({ name: '', unitCost: '', qty: '1' });
                setSelectedDbMaterial('');
            };

            const handleAddLaborToCalc = () => {
                if (!newLabor.task || !newLabor.minutes || !newLabor.rate) return;
                setCalcLabor([...calcLabor, { id: Date.now(), task: newLabor.task, minutes: parseFloat(newLabor.minutes), rate: parseFloat(newLabor.rate) }]);
                setNewLabor({ task: 'Labor', minutes: '', rate: newLabor.rate }); 
            };

            // --- CALCULATOR MATH ---
            const totalMaterialsCost = calcMaterials.reduce((sum, item) => sum + (item.unitCost * item.qty), 0);
            const totalLaborCost = calcLabor.reduce((sum, item) => sum + ((item.minutes / 60) * item.rate), 0);
            
            const overheadPerOrder = (parseFloat(monthlyOverhead) || 0) / (parseInt(monthlyOrders) || 1);
            
            // Calculate Discount
            const subtotalForDiscount = totalMaterialsCost + totalLaborCost + overheadPerOrder;
            const discountAmt = subtotalForDiscount * ((parseFloat(discountPercent) || 0) / 100);
            
            const shippingCost = parseFloat(perOrderCost) || 0;
            const totalAdditional = overheadPerOrder - discountAmt + shippingCost;
            
            const totalBaseCost = totalMaterialsCost + totalLaborCost + totalAdditional;
            const totalProfitAmount = totalBaseCost * (profitMargin / 100);
            const finalOrderPrice = totalBaseCost + totalProfitAmount;

            // ── QUANTITY FOR INVOICE ──
            const [orderQty, setOrderQty] = useLocalStorage('ppc_orderQty', '1');

            const canSave = (customerName || '').trim() !== '' && (itemDescription || '').trim() !== '' && finalOrderPrice > 0;

            const handleClearProject = () => {
                if(window.confirm("Are you sure you want to clear this project and start fresh?")) {
                    setCustomerName('');
                    setItemDescription('');
                    setOrderQty('1');
                }
            };

            const saveProductToComparison = () => {
                if (!canSave) return;
                const qty = parseInt(orderQty) || 1;
                setSavedProducts([...savedProducts, {
                    id: Date.now(), 
                    customerName: customerName, 
                    itemDescription: itemDescription, 
                    materialsCost: totalMaterialsCost, 
                    laborCost: totalLaborCost, 
                    additionalCosts: overheadPerOrder, 
                    discountAmt: discountAmt,
                    profit: totalProfitAmount, 
                    finalPrice: finalOrderPrice,
                    qty: qty,
                    totalPrice: finalOrderPrice * qty
                }]);
                
                const btn = document.getElementById('save-btn');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<span class="flex items-center gap-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Saved to Comparison & Invoice!</span>';
                btn.style.background = '#d4af37';
                btn.style.color = '#000';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.background = '';
                    btn.style.color = '';
                    // ── NAME PERSISTS - only clear after PDF export ──
                    // Do NOT clear customerName or itemDescription here
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }, 1500);
            };

            const toggleInvoiceItem = (prod) => {
                if (selectedInvoiceItems.find(i => i.id === prod.id)) {
                    setSelectedInvoiceItems(selectedInvoiceItems.filter(i => i.id !== prod.id));
                } else {
                    if (selectedInvoiceItems.length === 0 && !invoiceCustomer) {
                        setInvoiceCustomer(prod.customerName);
                    }
                    setSelectedInvoiceItems([...selectedInvoiceItems, prod]);
                }
            };

            const totalDiscountForInvoice = selectedInvoiceItems.reduce((sum, item) => sum + (item.discountAmt || 0), 0);
            const totalDueForInvoice = selectedInvoiceItems.reduce((sum, item) => sum + item.finalPrice, 0);

            // Enhanced PDF Export
            const exportPDF = async () => {
                setIsGenerating(true);
                setPdfStatus('');

                const element = document.getElementById('invoice-pdf-content');
                const fileName = `${invoiceCustomer || 'Client'}_Invoice_${invoiceOrderNum || '001'}.pdf`;
                const opt = {
                    margin: [0.4, 0.5, 0.4, 0.5],
                    filename: fileName,
                    image: { type: 'jpeg', quality: 1 },
                    html2canvas: { scale: 2, useCORS: true, logging: false, scrollY: 0, windowHeight: element.scrollHeight },
                    jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' },
                    pagebreak: { mode: ['avoid-all', 'css', 'legacy'] },
                    enableLinks: true
                };

                const afterExport = () => {
                    setIsGenerating(false);
                    setPdfStatus("✅ Invoice sent! Check your downloads or email.");
                    setInvoiceCounter(prev => prev + 1);
                    setCustomerName('');
                    setItemDescription('');
                    setOrderQty('1');
                    setSelectedInvoiceItems([]);
                    setInvoiceCustomer('');

                                <div className="lg:col-span-2">
                                    <div className="bg-zinc-800 p-2 rounded-[2rem] shadow-xl overflow-hidden">
                                        <div className="bg-zinc-900 text-center py-2 text-xs font-bold uppercase tracking-widest text-zinc-500 rounded-t-3xl">Live Preview</div>
                                        
                                        {/* THIS IS THE ACTUAL DIV THAT GETS TURNED INTO A PDF */}
                                        <div id="invoice-pdf-content" className="bg-white text-black p-6 w-full max-w-[800px] mx-auto">

                                            {/* Invoice Header */}
                                            <div className="flex justify-between items-start mb-6 pb-5 border-b-2 border-slate-100">
                                                <div>
                                                    <h1 className="text-4xl md:text-5xl font-black text-slate-900 tracking-tight leading-none mb-1">INVOICE</h1>
                                                    {businessName && <p className="text-[#d4af37] font-bold uppercase tracking-widest text-sm mt-1">{businessName}</p>}
                                                </div>
                                                <div className="text-right text-sm text-slate-500 mt-1">
                                                    <p className="mb-1"><span className="font-bold text-slate-800">Date:</span> {new Date().toLocaleDateString()}</p>
                                                    <p><span className="font-bold text-slate-800">Order #:</span> {invoiceOrderNum || 'Draft'}</p>
                                                </div>
                                            </div>

                                            {/* Customer Info */}
                                            <div className="mb-6">
                                                <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Bill To:</p>
                                                <p className="text-xl font-bold text-slate-800">{invoiceCustomer || 'Customer Name'}</p>
                                            </div>

                                            {/* Itemized Table */}
                                            <div className="w-full overflow-x-auto">
                                                <table className="w-full mb-6 min-w-[300px]">
                                                    <thead className="border-b-2 border-slate-800">
                                                        <tr>
                                                            <th className="py-3 text-left font-bold text-slate-800">Item Description</th>
                                                            <th className="py-3 text-center font-bold text-slate-800 w-16 md:w-24">Qty</th>
                                                            <th className="py-3 text-right font-bold text-slate-800 w-24 md:w-32">Price</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-100">
                                                        {selectedInvoiceItems.map(item => (
                                                            <tr key={item.id}>
                                                                <td className="py-2 font-semibold text-slate-700 break-words whitespace-normal">{item.itemDescription}</td>
                                                                <td className="py-2 text-center text-slate-600">{item.qty || 1}</td>
                                                                <td className="py-2 text-right font-bold text-slate-800">{formatCurrency(item.finalPrice)}</td>
                                                            </tr>
                                                        ))}
                                                        {selectedInvoiceItems.length === 0 && (
                                                            <tr>
                                                                <td colSpan="3" className="py-8 text-center text-slate-400 italic">No items selected for this invoice yet.</td>
                                                            </tr>
                                                        )}
                                                    </tbody>
                                                </table>
                                            </div>

                                            {/* Total */}
                                            <div className="flex justify-center md:justify-end mb-8">
                                                <div className="w-full max-w-[280px] bg-slate-50 p-4 rounded-xl border border-slate-200">
                                                    {totalDiscountForInvoice > 0 && (
                                                        <div className="flex justify-between items-center mb-3 border-b border-slate-200 pb-3">
                                                            <span className="font-bold text-slate-500 uppercase tracking-wider text-xs">Total Discount:</span>
                                                            <span className="text-lg font-bold text-emerald-500">-{formatCurrency(totalDiscountForInvoice)}</span>
                                                        </div>
                                                    )}
                                                    <div className="flex justify-between items-center">
                                                        <span className="font-bold text-slate-500 uppercase tracking-wider text-sm">Total Due:</span>
                                                        <span className="text-2xl font-black text-[#d4af37]">
                                                            {formatCurrency(totalDueForInvoice)}
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Payment Buttons — only renders when at least one included method has data */}
                                            {((includeCashApp && cashAppLink) || (includePaypal && paypalLink) || (includeVenmo && venmoLink) || (includeStripe && stripeLink) || (includeZelle && zelleQRData)) && (
                                                <div className="mb-5">
                                                    <p className="text-center text-xs font-bold uppercase tracking-widest text-slate-400 mb-3">PAY VIA — SELECT YOUR OPTION</p>
                                                    <div className="flex flex-col items-stretch gap-3">
                                                        {includeCashApp && cashAppLink && (
                                                            <a href={cashAppLink} target="_blank" rel="noopener noreferrer"
                                                                className="flex items-center justify-center gap-2 w-full px-6 py-3 rounded-xl font-black uppercase tracking-wide text-sm no-underline transition-all"
                                                                style={{background:'#00d632', color:'#000', textDecoration:'none'}}>
                                                                <span className="font-black">$</span> Cash App
                                                            </a>
                                                        )}
                                                        {includePaypal && paypalLink && (
                                                            <a href={paypalLink} target="_blank" rel="noopener noreferrer"
                                                                className="flex items-center justify-center gap-2 w-full px-6 py-3 rounded-xl font-black uppercase tracking-wide text-sm no-underline transition-all"
                                                                style={{background:'#003087', color:'#fff', textDecoration:'none'}}>
                                                                <span className="font-black">PP</span> PayPal
                                                            </a>
                                                        )}
                                                        {includeVenmo && venmoLink && (
                                                            <a href={venmoLink} target="_blank" rel="noopener noreferrer"
                                                                className="flex items-center justify-center gap-2 w-full px-6 py-3 rounded-xl font-black uppercase tracking-wide text-sm no-underline transition-all"
                                                                style={{background:'#008cff', color:'#fff', textDecoration:'none'}}>
                                                                <span className="font-black">V</span> Venmo
                                                            </a>
                                                        )}
                                                        {includeStripe && stripeLink && (
                                                            <a href={stripeLink} target="_blank" rel="noopener noreferrer"
                                                                className="flex items-center justify-center gap-2 w-full px-6 py-3 rounded-xl font-black uppercase tracking-wide text-sm no-underline transition-all"
                                                                style={{background:'#635bff', color:'#fff', textDecoration:'none'}}>
                                                                <span className="font-black">S</span> Stripe
                                                            </a>
                                                        )}
                                                        {includeZelle && zelleQRData && (
                                                            <div className="flex flex-col items-center p-4 rounded-xl" style={{background:'#f0ecfc', border:'2px solid #6d1ed4'}}>
                                                                <p className="text-[#6d1ed4] font-black text-xs uppercase tracking-wide mb-0.5">ZELLE®</p>
                                                                <p className="text-[#6d1ed4] text-[10px] font-semibold">Send money with Zelle®</p>
                                                                <p className="text-slate-500 text-[9px]">Scan in your banking app to pay</p>
                                                                <img src={zelleQRData} alt="Zelle QR Code" className="w-28 h-28 rounded-lg object-contain my-2" />
                                                                <p className="text-[#6d1ed4] text-[9px] font-black uppercase tracking-widest">SCAN ME TO PAY</p>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            )}

                                            {/* Footer */}
                                            <div className="pt-5 border-t-2 border-slate-100 text-center">
                                                <p className="font-bold text-slate-900 text-base mb-1">Thank you for your purchase.</p>
                                                <p className="font-bold text-[#d4af37] uppercase tracking-widest text-sm">PLEASE SUBMIT PAYMENT.</p>
                                                {businessName && <p className="text-slate-500 text-xs mt-3 font-medium">{businessName}</p>}
                                            </div>

                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #18181b; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #52525b; }
    </style>
</body>
</html>
</body></html>
